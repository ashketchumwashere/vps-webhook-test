name: IMDS Probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test Azure IMDS access from runner
        run: |
          echo "=== RUNNER ENVIRONMENT ==="
          echo "Hostname: $(hostname)"
          echo "IP: $(curl -sf https://api.ipify.org 2>/dev/null || echo unknown)"
          echo ""
          echo "=== AZURE IMDS instanceinfo (no header) ==="
          curl -sf --max-time 5 http://169.254.169.254/metadata/v1/instanceinfo 2>&1 || echo "INSTANCEINFO_BLOCKED"
          echo ""
          echo "=== AZURE IMDS instance (Metadata: true header) ==="
          curl -sf --max-time 5 -H "Metadata: true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>&1 || echo "INSTANCE_BLOCKED"
          echo ""
          echo "=== AZURE IMDS managed identity token ==="
          curl -sf --max-time 5 -H "Metadata: true" \
            "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" 2>&1 || echo "IDENTITY_BLOCKED"
          echo ""
          echo "=== AWS IMDS (for comparison) ==="
          curl -sf --max-time 3 http://169.254.169.254/latest/meta-data/ 2>&1 || echo "AWS_IMDS_BLOCKED"
          echo ""
          echo "=== GCP Metadata (for comparison) ==="
          curl -sf --max-time 3 -H "Metadata-Flavor: Google" \
            http://metadata.google.internal/computeMetadata/v1/instance/ 2>&1 || echo "GCP_BLOCKED"
