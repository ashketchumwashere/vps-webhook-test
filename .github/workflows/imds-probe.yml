name: IMDS Focused
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Focused IMDS probe
        run: |
          echo "=== SCHEDULEDEVENTS ==="
          curl -sf -H "Metadata: true" "http://169.254.169.254/metadata/scheduledevents?api-version=2020-07-01" || echo BLOCKED
          echo ""
          echo "=== ATTESTED DOCUMENT (Azure-signed) ==="
          curl -sf -H "Metadata: true" "http://169.254.169.254/metadata/attested/document?api-version=2021-02-01&nonce=1234567890" | python3 -c "import sys,json; d=json.load(sys.stdin); print(chr(10).join([f\"{k}: {str(v)[:200]}\" for k,v in d.items()]))" || echo BLOCKED
          echo ""
          echo "=== INTERNAL ORCHESTRATOR ==="
          curl -sf --max-time 5 "https://hosted-compute-request-orchestrator-prod-eus-02.githubapp.com/vm/v1" -v 2>&1 | head -30 || echo BLOCKED
          echo ""
          echo "=== GITHUB_ACTIONS ENV VARS ==="
          env | grep -E "^(GITHUB|RUNNER|ACTIONS)" | grep -v -iE "(token|secret|key)" | sort
