name: IMDS Probe Deep
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Deep IMDS and internal infra probe
        run: |
          echo "=== INSTANCE INFO (no header) ==="
          curl -sf http://169.254.169.254/metadata/v1/instanceinfo
          echo ""

          echo "=== SUBSCRIPTION + VM DETAILS ==="
          META=$(curl -sf -H "Metadata: true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01")
          echo "$META" | python3 -c "
import sys,json
d=json.load(sys.stdin)['compute']
print('subscriptionId:', d['subscriptionId'])
print('resourceGroupName:', d['resourceGroupName'])
print('vmId:', d['vmId'])
print('vmSize:', d['vmSize'])
print('location:', d['location'])
print('name:', d['name'])
print('tags:', d['tags'][:300])
"
          echo ""
          echo "=== INTERNAL ORCHESTRATOR URL ==="
          curl -sf --max-time 5 \
            https://hosted-compute-request-orchestrator-prod-eus-02.githubapp.com/vm/v1 \
            2>&1 || echo "ORCHESTRATOR_RESPONSE_ABOVE"
          echo ""
          echo "=== IMDS SCHEDULEDEVENTS ==="
          curl -sf --max-time 5 -H "Metadata: true" \
            "http://169.254.169.254/metadata/scheduledevents?api-version=2020-07-01" 2>&1
          echo ""
          echo "=== ATTESTED DATA (signed by Azure) ==="
          curl -sf --max-time 5 -H "Metadata: true" \
            "http://169.254.169.254/metadata/attested/document?api-version=2021-02-01&nonce=1234567890" \
            2>&1 | python3 -c "import sys,json; d=json.load(sys.stdin); print('signature_len:', len(d.get('signature',''))); print('encoding:', d.get('encoding')); print('first200:', d.get('signature','')[:200])" 2>/dev/null || echo "ATTESTED_BLOCKED"
          echo ""
          echo "=== NETWORK NEIGHBORS (internal subnet 10.1.0.0/20) ==="
          ip route show
          echo ""
          echo "=== RUNNER SERVICE ENDPOINTS ==="
          env | grep -iE "(GITHUB|RUNNER|ACTIONS)" | grep -v TOKEN | grep -v SECRET | sort
